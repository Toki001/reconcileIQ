name: Publish reviewed release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish private GHCR images after repository/package permissions and costs are reviewed"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ghcr-release
  cancel-in-progress: false
jobs:
  verify:
    if: inputs.publish && vars.RECONCILE_GHCR_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ghcr-release
    permissions:
      contents: read
      packages: write
      actions: read # Read required-reviewer protection metadata; no Actions writes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.13"
      - name: Verify explicit release, remote, protected approval and unused tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_guard.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build all three images, scan before any registry write
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          metadata=(--label "org.opencontainers.image.source=https://github.com/$REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$GITHUB_REF_NAME")
          docker build "${metadata[@]}" -f infra/docker/web.Dockerfile -t reconcileiq-web:release .
          docker build "${metadata[@]}" --target api -f infra/docker/python.Dockerfile -t reconcileiq-api:release .
          docker build "${metadata[@]}" --target worker -f infra/docker/python.Dockerfile -t reconcileiq-worker:release .
          mkdir -p reports "$RUNNER_TEMP/trivy"
          for service in web api worker; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "/reports/$service.json" "reconcileiq-$service:release"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-container-vulnerabilities
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # No latest tag. Push only immutable commit + reviewed semver; deploy by digest.
      - name: Publish images and record registry digests
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          prefix="ghcr.io/${REPOSITORY,,}"
          for service in web api worker; do
            image="$prefix-$service"
            docker tag "reconcileiq-$service:release" "$image:sha-$GITHUB_SHA"
            docker tag "reconcileiq-$service:release" "$image:$GITHUB_REF_NAME"
            docker push "$image:sha-$GITHUB_SHA"
            docker push "$image:$GITHUB_REF_NAME"
            docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          done
