          - WEBHOOK_INVALID
          - WEBHOOK_EXPIRED
          - INTERNAL_ERROR
          title: Code
        detail:
          type: string
          title: Detail
        instance:
          type: string
          title: Instance
        trace_id:
          type: string
          title: Trace Id
        errors:
          items:
            $ref: '#/components/schemas/FieldError'
          type: array
          title: Errors
          default: []
      type: object
      required:
      - type
      - title
      - status
