  securitySchemes:
    BearerAuth:
      type: http
      description: Opaque organization-scoped API key. Server-side digest lookup supplies
        actor and role. Keys are never accepted in query parameters. Local bootstrap
        provisions admin, reviewer and auditor keys.
      scheme: bearer
    SupplierHmac:
      type: apiKey
      description: 'v1=<HMAC-SHA256(secret, ASCII(X-Timestamp) + ''.'' + exact raw
        JSON bytes)>. X-Supplier-Id selects a server-configured organization and secret.
        Timestamp tolerance: 300 seconds.'
      in: header
      name: X-Signature
