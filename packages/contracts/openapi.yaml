openapi: 3.1.0
info:
  title: ReconcileIQ API
  description: Tenant-scoped accounts payable API. No payments. REST owns mutations;
    authenticated GraphQL POST /graphql owns dashboard queries. Async 202 is durable
    admission, not processing completion. Money uses bounded integer minor units with
    explicit ISO 4217 currencies (USD, EUR, PHP, JPY, KWD). Mutations require Idempotency-Key;
    existing-record writes require expected_version. Lists use signed stable keyset
    cursors. See packages/contracts/README.md for the reviewed authentication, pagination,
    errors, upload and retry semantics.
  version: 0.2.0
paths:
  /health/live:
    get:
      tags:
      - health
      summary: Live
      operationId: getLiveness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      tags:
      - health
      summary: Ready
      operationId: getReadiness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          headers:
            Retry-After:
              description: Suggested delay in seconds before polling/retrying
              schema:
                type: integer
                minimum: 1
  /v1/demo/snapshot:
    get:
      tags:
      - demo
      summary: Snapshot
      description: Authenticated, tenant-scoped synthetic compatibility view. Bounded
        to 100 records per collection; business list APIs and GraphQL use signed cursor
        pagination.
      operationId: getDemoSnapshot
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSnapshot'
        '401':
          description: Bearer credential missing, invalid or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '404':
          description: Resource does not exist in the authenticated organization
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: Version, state, uniqueness or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '413':
          description: Request body exceeds the bounded API payload limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '422':
          description: Schema, currency, accounting or cursor validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '429':
          description: Organization has reached its pending-job admission limit; Retry-After
            is returned
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
          headers:
            Retry-After:
              description: Suggested delay in seconds before polling/retrying
              schema:
                type: integer
                minimum: 1
        '500':
          description: Unexpected failure; use trace_id when reporting the error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '503':
          description: Dependency unavailable; retry with the same Idempotency-Key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
          headers:
            Retry-After:
              description: Suggested delay in seconds before polling/retrying
              schema:
                type: integer
                minimum: 1
      security:
      - BearerAuth: []
      x-role-permissions:
      - admin
      - reviewer
      - auditor
  /v1/invoices/upload-requests:
    post:
      tags:
      - invoices
      summary: Upload Request
      description: Admin/reviewer. Creates an unextracted invoice and a tenant-scoped,
        ten-minute presigned PUT. Completion verifies size, PDF magic bytes and SHA-256,
        then seals a separate immutable input copy.
      operationId: requestInvoiceUpload
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_.:-]+$
          description: Organization-wide unique retry key; retained at least 24 hours.
            Same actor/method/path/normalized body replays the committed response;
            different request returns 409.
          title: Idempotency-Key
