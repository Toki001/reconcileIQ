          - NOT_FOUND
          - VALIDATION_ERROR
          - VERSION_CONFLICT
          - STATE_CONFLICT
          - IDEMPOTENCY_CONFLICT
          - INVALID_CURSOR
          - UPLOAD_INVALID
          - DEPENDENCY_UNAVAILABLE
          - DATABASE_UNAVAILABLE
