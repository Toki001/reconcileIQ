receivers:
  otlp:
    protocols:
      http: { endpoint: "0.0.0.0:4318" }
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    timeout: 2s
    sending_queue: { enabled: true, queue_size: 256, num_consumers: 2 }
    retry_on_failure:
      {
        enabled: true,
        initial_interval: 1s,
        max_interval: 3s,
        max_elapsed_time: 10s,
      }
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion: { enabled: true }
    metric_expiration: 2m
extensions:
  health_check: { endpoint: "0.0.0.0:13133" }
service:
  extensions: [health_check]
  pipelines:
    traces:
      {
        receivers: [otlp],
        processors: [memory_limiter, batch],
        exporters: [otlp_http/tempo],
      }
    metrics:
      {
        receivers: [otlp],
        processors: [memory_limiter, batch],
        exporters: [prometheus],
      }
