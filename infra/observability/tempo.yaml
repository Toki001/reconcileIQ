server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
target: all
stream_over_http_enabled: true
backend_scheduler:
  local_work_path: /var/tempo/scheduler
  provider:
    retention:
      interval: 1m
    compaction:
      compaction:
        block_retention: 1h
        compacted_block_retention: 5m
backend_worker:
  compaction:
    block_retention: 1h
    compacted_block_retention: 5m
