# Dedicated isolated synthetic benchmark project. Never merge with retained Compose.
name: reconcileiq-m08
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run make env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
      POSTGRES_DB: ${POSTGRES_DB:?Run make env}
    ports:
      - 127.0.0.1:25432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 1024m
    cpus: "1"
  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:d5c8b200a061242868833c8bbdd0703534a4a06ffe654a853e33acd46c7ce258
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Run make env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Run make env}
    ports:
      - 127.0.0.1:25672:5672
      - 127.0.0.1:25673:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1"
  minio:
    image: reconcileiq-minio:m08
    build:
      context: .
      dockerfile: infra/docker/minio.Dockerfile
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run make env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make env}
    ports:
      - 127.0.0.1:29100:9000
      - 127.0.0.1:29101:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1"
  migrate:
    image: reconcileiq-python:m08
    build: &id001
      context: .
      dockerfile: infra/docker/python.Dockerfile
    init: true
    read_only: true
    tmpfs: &id002
      - /tmp:size=256m,mode=1777
    cap_drop: &id003
      - ALL
    security_opt: &id004
      - no-new-privileges:true
    pids_limit: 256
    environment: &id005
      RECONCILE_AI_ENABLED: "false"
      RECONCILE_AI_API_KEY: ""
      RECONCILE_AI_PROJECT_ID: ${RECONCILE_AI_PROJECT_ID:-}
      RECONCILE_AI_MODEL: ${RECONCILE_AI_MODEL:-gemini-3.5-flash-lite}
      RECONCILE_AI_ENDPOINT: ${RECONCILE_AI_ENDPOINT:-https://generativelanguage.googleapis.com}
      RECONCILE_AI_REQUESTS_PER_MINUTE: ${RECONCILE_AI_REQUESTS_PER_MINUTE:-2}
      RECONCILE_AI_REQUESTS_PER_DAY: ${RECONCILE_AI_REQUESTS_PER_DAY:-20}
      RECONCILE_AI_CONCURRENCY: ${RECONCILE_AI_CONCURRENCY:-1}
      RECONCILE_AI_MAX_INPUT_CHARACTERS: ${RECONCILE_AI_MAX_INPUT_CHARACTERS:-20000}
      RECONCILE_AI_MAX_INPUT_TOKENS: ${RECONCILE_AI_MAX_INPUT_TOKENS:-6000}
      RECONCILE_AI_MAX_OUTPUT_TOKENS: ${RECONCILE_AI_MAX_OUTPUT_TOKENS:-8192}
      RECONCILE_AI_TIMEOUT_SECONDS: ${RECONCILE_AI_TIMEOUT_SECONDS:-20}
      RECONCILE_OCR_ENABLED: "true"
      RECONCILE_ENVIRONMENT: local
      RECONCILE_DATABASE_URL:
        postgresql+psycopg://${POSTGRES_USER:?Run make env}:${POSTGRES_PASSWORD:?Run make env}@postgres:5432/${POSTGRES_DB:?Run
        make env}
      RECONCILE_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:?Run make env}:${RABBITMQ_DEFAULT_PASS:?Run make env}@rabbitmq:5672//
      RECONCILE_MINIO_ENDPOINT: http://minio:9000
      RECONCILE_INFRASTRUCTURE_REQUIRED: "true"
      RECONCILE_WORKER_ENABLED: "true"
      RECONCILE_WORKER_CONCURRENCY: ${RECONCILE_WORKER_CONCURRENCY:-4}
      RECONCILE_ADMITTED_JOB_LIMIT: "8"
      RECONCILE_WORKER_LEASE_SECONDS: ${RECONCILE_WORKER_LEASE_SECONDS:-120}
      RECONCILE_DISPATCH_INTERVAL_SECONDS: ${RECONCILE_DISPATCH_INTERVAL_SECONDS:-2}
      RECONCILE_DISPATCH_BATCH_SIZE: ${RECONCILE_DISPATCH_BATCH_SIZE:-25}
      RECONCILE_DISPATCH_VISIBILITY_SECONDS: ${RECONCILE_DISPATCH_VISIBILITY_SECONDS:-180}
      RECONCILE_RETRY_BASE_SECONDS: ${RECONCILE_RETRY_BASE_SECONDS:-5}
      RECONCILE_RETRY_MAX_SECONDS: ${RECONCILE_RETRY_MAX_SECONDS:-300}
      RECONCILE_ADMIN_TOKEN: ${RECONCILE_ADMIN_TOKEN:?Run make env}
      RECONCILE_REVIEWER_TOKEN: ${RECONCILE_REVIEWER_TOKEN:?Run make env}
      RECONCILE_AUDITOR_TOKEN: ${RECONCILE_AUDITOR_TOKEN:?Run make env}
      RECONCILE_CURSOR_SECRET: ${RECONCILE_CURSOR_SECRET:?Run make env}
      RECONCILE_SUPPLIER_WEBHOOKS: ${RECONCILE_SUPPLIER_WEBHOOKS:?Run make env}
      RECONCILE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Run make env}
      RECONCILE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run make env}
      RECONCILE_MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:29100
    command:
      - sh
      - -c
      - python -m alembic upgrade head && python -m reconcileiq_database.seed
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 1024m
    cpus: "1"
  api:
    image: reconcileiq-python:m08
    build: *id001
    init: true
    read_only: true
    tmpfs: *id002
    cap_drop: *id003
    security_opt: *id004
    pids_limit: 256
    environment: *id005
    ports:
      - 127.0.0.1:28000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "1.5"
  worker:
    image: reconcileiq-python:m08
    build: *id001
    init: true
    read_only: true
    tmpfs: *id002
    cap_drop: *id003
    security_opt: *id004
    pids_limit: 256
    environment: *id005
    command:
      - celery
      - -A
      - reconcileiq_worker.app:celery_app
      - worker
      - --loglevel=WARNING
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A reconcileiq_worker.app:celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 2048m
    cpus: "2"
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: reconcileiq-web:m08
    init: true
    environment:
      API_BASE_URL: http://api:8000
      RECONCILE_WEB_API_TOKEN: ${RECONCILE_AUDITOR_TOKEN:?Run make env}
      RECONCILE_WEB_SESSION_SECRET: ${RECONCILE_WEB_SESSION_SECRET:?Run make env}
    ports:
      - 127.0.0.1:23100:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
volumes:
  postgres-data: null
  rabbitmq-data: null
  minio-data: null
