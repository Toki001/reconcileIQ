[project]
name = "reconcileiq-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["reconcileiq-telemetry",
    "pypdf>=6,<7",
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.38,<1",
    "reconcileiq-database",
    "reconcileiq-reconciliation",
    "kombu>=5.5,<6",
    "strawberry-graphql[fastapi]>=0.336,<1",
    "minio>=7.2,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
